name: Deploy Documentation

on:
  push:
    branches:
      - main
      - master
      - '5.0'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs
        env:
          # YUIDoc renders over a thousand source files in one process and ran out of
          # memory at the default 2 GB heap on some runs.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
