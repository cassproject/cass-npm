sonar.projectKey=cass-npm
sonar.projectName=cass-npm
sonar.sources=src,index.js,scripts
sonar.exclusions=**/node_modules/**,src/test/**
sonar.tests=src/test
sonar.test.inclusions=src/test/**

# Rules that do not apply to parts of this library. One-off cases elsewhere are
# marked inline with NOSONAR and a reason.
sonar.issue.ignore.multicriteria=httpS3000l,httpCtdl,httpEduworks,httpCass,s3000lAccessors,mochaSetup

# S5332 (use https): the schema classes name their JSON-LD @context and @type with
# http:// IRIs. They are identifiers, never fetched, and changing them would change
# the data written to and matched in repositories.
sonar.issue.ignore.multicriteria.httpS3000l.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.httpS3000l.resourceKey=src/com/asd/s3000l/**/*
sonar.issue.ignore.multicriteria.httpCtdl.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.httpCtdl.resourceKey=src/org/credentialengine/**/*
sonar.issue.ignore.multicriteria.httpEduworks.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.httpEduworks.resourceKey=src/com/eduworks/schema/**/*
sonar.issue.ignore.multicriteria.httpCass.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.httpCass.resourceKey=src/org/cassproject/schema/**/*

# S4275 (getter/setter names the wrong field): each S3000L class keeps a data field
# (messageContentItems) beside a nested class of the same name capitalised
# (MessageContentItems). The accessors use the data field, which is correct, and
# renaming the nested classes would break the public API.
sonar.issue.ignore.multicriteria.s3000lAccessors.ruleKey=javascript:S4275
sonar.issue.ignore.multicriteria.s3000lAccessors.resourceKey=src/com/asd/s3000l/**/*

# S2187 (test file without tests): 0.start.test.js only registers a Cypress hook.
sonar.issue.ignore.multicriteria.mochaSetup.ruleKey=javascript:S2187
sonar.issue.ignore.multicriteria.mochaSetup.resourceKey=src/test/0.start.test.js
